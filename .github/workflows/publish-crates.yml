name: Publish crates

# Publishes the workspace to crates.io so `cargo install forgetop` works.
#
# Called by the dist release pipeline as a custom publish job (see `publish-jobs`
# in dist-workspace.toml), which runs it only for a real release, after the
# GitHub Release exists. Callers must pass `secrets: inherit`.
# `plan` is optional and unused — dist passes it to every custom job, and an
# undeclared input is a hard error, so it is declared and ignored.
on:
  workflow_call:
    inputs:
      plan:
        required: false
        type: string
  workflow_dispatch:

concurrency:
  # `github.workflow` is the CALLER's name for a reusable workflow, so a run started by
  # Release lands in a different group than a manual one.
  group: publish-crates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # The SPA gets its own build step below, so build.rs must not run npm again.
  FORGETOP_SKIP_WEB_BUILD: "1"

jobs:
  publish:
    name: cargo publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: crates/forgetop-server/web/package-lock.json

      # `cargo publish` packages the working tree, and forgetop-server's `include`
      # ships `web/dist` verbatim — so the dashboard must be built here, before
      # packaging, or the crate goes out with a stale or placeholder UI.
      - name: Build dashboard SPA
        working-directory: crates/forgetop-server/web
        run: |
          npm ci
          npm run build

      - name: Verify the built dashboard is real
        run: |
          index=crates/forgetop-server/web/dist/index.html
          test -s "$index" || { echo "::error::$index is missing — refusing to publish"; exit 1; }
          if grep -q "The dashboard app wasn't built" "$index"; then
            echo "::error::$index is the build.rs placeholder — refusing to publish"
            exit 1
          fi

      # A crates.io version is immutable and a re-run of a release would otherwise
      # fail the whole pipeline on "crate version already uploaded".
      - name: Check whether this version is already published
        id: check
        run: |
          version=$(cargo metadata --format-version 1 --no-deps \
            | jq -r '.packages[] | select(.name == "forgetop") | .version')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          code=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H 'User-Agent: forgetop release workflow (github.com/magna-nz/forgetop)' \
            "https://crates.io/api/v1/crates/forgetop/$version")
          if [ "$code" = "200" ]; then
            echo "forgetop $version is already on crates.io — skipping publish"
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      # One atomic publish for all five crates; cargo works out the order and waits
      # for each to land in the index before the crate that depends on it goes up.
      #
      # --allow-dirty is required, not sloppiness: `web/dist` is gitignored but pulled
      # into the package by forgetop-server's `include`, and cargo counts an included
      # file that git doesn't track as a dirty working tree. The checkout here is a
      # fresh clone of the release tag, so the built SPA is the only thing that's dirty.
      - name: Publish to crates.io
        if: steps.check.outputs.published == 'false'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --workspace --locked --allow-dirty
