name: Integration

# Live provider integration tests. Runs on every (non-fork) PR, on push to main,
# and on release tags as a gate. A nightly run sweeps any leaked fixtures.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  schedule:
    - cron: "0 3 * * *" # nightly cleanup sweep
  workflow_dispatch:
  # Callable so the release pipeline can gate on this suite before it builds or
  # publishes anything. Callers must pass `secrets: inherit`.
  # `plan` is optional and unused — dist passes it to every custom job, and an
  # undeclared input is a hard error, so it is declared and ignored.
  workflow_call:
    inputs:
      plan:
        required: false
        type: string

concurrency:
  # `github.workflow` is the CALLER's name for a reusable workflow, so a run started by
  # Release lands in a different group than the standalone one — without it they share a
  # group on the same ref and cancel-in-progress kills one of them.
  group: integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  integration:
    name: live provider integration
    runs-on: ubuntu-latest
    # Fork PRs can't read secrets — skip rather than fail. Same-repo PRs, main,
    # tags, schedule and manual runs proceed.
    #
    # The second clause keeps Release's dry-run off PRs: dist runs the whole release
    # pipeline on every PR, so without it each PR would run this live suite twice and
    # build two concurrent sets of fixtures. The release gate is what matters on a TAG,
    # where this clause doesn't apply.
    if: >-
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository) &&
      !(github.event_name == 'pull_request' && github.workflow == 'Release')
    env:
      # Providers that MUST run. A provider named here whose credentials are missing
      # fails the job instead of skipping silently — a skip is otherwise
      # indistinguishable from a pass, which is how Jira went unnoticed for months.
      # Add jira once its four secrets exist; bitbucket has no CI credentials.
      FORGETOP_IT_PROVIDERS: github,gitlab,azure,linear
      FORGETOP_IT_GITHUB_TOKEN: ${{ secrets.FORGETOP_IT_GITHUB_TOKEN }}
      FORGETOP_IT_GITHUB_REPO: ${{ secrets.FORGETOP_IT_GITHUB_REPO }}
      FORGETOP_IT_GITLAB_TOKEN: ${{ secrets.FORGETOP_IT_GITLAB_TOKEN }}
      FORGETOP_IT_GITLAB_PROJECT: ${{ secrets.FORGETOP_IT_GITLAB_PROJECT }}
      FORGETOP_IT_AZURE_PAT: ${{ secrets.FORGETOP_IT_AZURE_PAT }}
      FORGETOP_IT_AZURE_ORG: ${{ secrets.FORGETOP_IT_AZURE_ORG }}
      FORGETOP_IT_AZURE_PROJECT: ${{ secrets.FORGETOP_IT_AZURE_PROJECT }}
      FORGETOP_IT_AZURE_REPO: ${{ secrets.FORGETOP_IT_AZURE_REPO }}
      FORGETOP_IT_LINEAR_KEY: ${{ secrets.FORGETOP_IT_LINEAR_KEY }}
      FORGETOP_IT_LINEAR_TEAM: ${{ secrets.FORGETOP_IT_LINEAR_TEAM }}
      FORGETOP_IT_JIRA_TOKEN: ${{ secrets.FORGETOP_IT_JIRA_TOKEN }}
      FORGETOP_IT_JIRA_EMAIL: ${{ secrets.FORGETOP_IT_JIRA_EMAIL }}
      FORGETOP_IT_JIRA_SITE: ${{ secrets.FORGETOP_IT_JIRA_SITE }}
      FORGETOP_IT_JIRA_PROJECT: ${{ secrets.FORGETOP_IT_JIRA_PROJECT }}
      # The nightly schedule sweeps leaked fixtures; other runs rely on teardown.
      FORGETOP_IT_SWEEP: ${{ github.event_name == 'schedule' && '1' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Integration tests (serial — shared fixtures)
        run: cargo test -p forgetop-providers --features integration -- --nocapture --test-threads=1
