name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # The dashboard SPA is built in its own step below; the cargo build then just embeds it.
  FORGETOP_SKIP_WEB_BUILD: "1"

jobs:
  test:
    name: build · test · clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: crates/forgetop-server/web/package-lock.json
      - name: Install dashboard deps
        working-directory: crates/forgetop-server/web
        run: npm ci
      - name: Dashboard tests
        working-directory: crates/forgetop-server/web
        run: npm run test
      - name: Build dashboard SPA
        working-directory: crates/forgetop-server/web
        run: npm run build
      - name: Build
        run: cargo build --workspace --locked
      - name: Test
        run: cargo test --workspace --locked
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
