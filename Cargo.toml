[workspace]
resolver = "2"
members = [
    "crates/forgetop-core",
    "crates/forgetop-providers",
    "crates/forgetop-tui",
    "crates/forgetop-server",
    "crates/forgetop-cli",
]

[workspace.package]
version = "1.3.1"
edition = "2021"
authors = ["magna-nz"]
license = "MIT"
repository = "https://github.com/magna-nz/forgetop"
homepage = "https://github.com/magna-nz/forgetop"

[workspace.dependencies]
# Internal crates. crates.io refuses a publish whose path deps carry no version
# requirement, so each one pairs `path` (used for local builds) with a caret
# requirement (used by the published crate). Caret, not `=`, so a version bump
# resolves siblings to the new version without touching these four lines.
forgetop-core = { path = "crates/forgetop-core", version = "1.0.0" }
forgetop-providers = { path = "crates/forgetop-providers", version = "1.0.0" }
forgetop-tui = { path = "crates/forgetop-tui", version = "1.0.0" }
forgetop-server = { path = "crates/forgetop-server", version = "1.0.0" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1"
futures-util = { version = "0.3", default-features = false, features = ["std", "async-await"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "fs"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
uuid = { version = "1", features = ["v4"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native"] }
dirs = "5"
base64 = "0.22"
similar = "2"
ratatui = "0.29"
crossterm = "0.28"
fuzzy-matcher = "0.3"
synoptic = "2"
# Renders PR and work-item descriptions in the TUI. No defaults: the HTML writer and CLI are unused.
pulldown-cmark = { version = "0.13", default-features = false }
open = "5"
dotenvy = "0.15"
notify-rust = "4"
axum = { version = "0.7", features = ["ws"] }
tower-http = { version = "0.5", features = ["cors"] }
rust-embed = { version = "8", features = ["debug-embed"] }
mime_guess = "2"
regex = "1"
fs2 = "0.4"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
