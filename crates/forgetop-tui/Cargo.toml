[package]
name = "forgetop-tui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Ratatui terminal interface for forgetop. Internal crate: no API stability guarantees, use the `forgetop` binary instead."

[dependencies]
forgetop-core.workspace = true
# `line_count` sizes the scroll range of wrapped detail panes by the rows they actually take.
ratatui = { workspace = true, features = ["unstable-rendered-line-info"] }
serde.workspace = true
crossterm.workspace = true
tokio.workspace = true
chrono.workspace = true
open.workspace = true
notify-rust.workspace = true
fuzzy-matcher.workspace = true
synoptic.workspace = true
pulldown-cmark.workspace = true

[dev-dependencies]
tempfile = "3"
async-trait.workspace = true
serde_json.workspace = true
